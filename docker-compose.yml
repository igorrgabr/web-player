services:
  postgres:
    image: postgres:16-alpine
    container_name: web_player_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-web_player}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-web_player}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

